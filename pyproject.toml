[project]
name = "wm-percept-harness"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.28,<1",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
]

[project.scripts]
percept = "percept_harness.cli:main"

[project.optional-dependencies]
# Provision a hardware-compatible torch/torchvision pair before installing these
# extras. Upstream VBench itself is installed separately with --no-deps.
clipiqa = [
  "pyiqa==0.1.16",
  "numpy==2.2.6",
  "Pillow==11.3.0",
  "opencv-python-headless==4.11.0.86",
]
motion = [
  "numpy==2.2.6",
  "Pillow==11.3.0",
  "opencv-python-headless==4.11.0.86",
  "tqdm==4.69.0",
  "omegaconf==2.3.0",
  "decord==0.6.0",
  "imageio==2.37.4",
  "scipy==1.17.1",
]

[dependency-groups]
dev = ["pytest>=8.4,<9", "Pillow==11.3.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/percept_harness"]
