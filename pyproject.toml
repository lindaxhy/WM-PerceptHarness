[project]
name = "las-repro"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "uvicorn>=0.35,<1",
]

[project.scripts]
las-repro = "las_repro.cli:main"

[project.optional-dependencies]
tos = ["tos>=2.8,<3"]
gpu = [
  "accelerate>=1.10,<2",
  "qwen-vl-utils>=0.0.14",
  "transformers>=4.57,<5",
]
dev = ["pytest>=8.4,<9", "pytest-cov>=6.2,<7"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
