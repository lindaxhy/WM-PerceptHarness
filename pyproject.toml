[project]
name = "wm-percept-harness"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.28,<1",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
]

[project.scripts]
percept = "percept_harness.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.4,<9", "pytest-cov>=6.2,<7"]
# optional columns of scripts/evaluate_wm_fidelity.py: description similarity and paired tests
fidelity = ["sentence-transformers>=3,<7", "scipy>=1.13,<2"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/percept_harness"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
